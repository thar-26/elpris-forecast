name: publish page

# Builds the web page from the record and publishes it on GitHub Pages.
# Runs after every daily forecast, after every push, and by hand.
on:
  workflow_run:
    workflows: ["daily forecast"]
    types: [completed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # always the newest record, including the commit the daily run just made

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Build the page
        run: python -m elpris site --record-dir record --out site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Publish
        id: deploy
        uses: actions/deploy-pages@v5
