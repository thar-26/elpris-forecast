name: publish page

# Builds the web page from the record and publishes it on GitHub Pages.
# Runs after every daily forecast, after every push, and by hand.
on:
  workflow_run:
    workflows: ["daily forecast"]
    types: [completed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      # Fails at once, with a clear message, if GitHub Pages is not switched on for this repository
      # (Settings, Pages, Source: "GitHub Actions").
      - name: Check that GitHub Pages is switched on
        uses: actions/configure-pages@v6

      - uses: actions/checkout@v5
        with:
          ref: main   # always the newest record, including the commit the daily run just made

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Build the page
        run: python -m elpris site --record-dir record --out site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      # GitHub's artifact service sometimes cannot find an artifact uploaded seconds
      # earlier ("Fetching artifact metadata failed ... re-run the deployment at a later
      # time"). Seen on about half the runs from 24 Nov 2026. So: try, wait, try once more.
      # The job fails only if the second attempt fails too.
      - name: Publish
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before retrying the publish
        if: steps.deploy.outcome == 'failure'
        run: sleep 30

      - name: Publish (retry)
        id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
