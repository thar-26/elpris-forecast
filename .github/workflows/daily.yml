name: daily forecast

# Must run between midnight and 12:00 Swedish time: after the day has started, and before the
# next day's real prices are published around 13:00. After 12:00 the forecast step records nothing.
#
# GitHub starts scheduled runs late. On this repository the first four started 6 hours 45 minutes
# to 7 hours after the time asked for. So the times below are set just after midnight Swedish time.
# A run that starts on time and a run that starts 7 hours late both land inside the window.
# A forecast is written only once, so the second and third run change nothing if the first one worked.
on:
  schedule:
    - cron: "17 23 * * *"   # 23:17 UTC = 01:17 Swedish summer time, 00:17 winter time
    - cron: "47 0 * * *"    # backup, 1.5 hours later
    - cron: "17 2 * * *"    # last backup: still inside the window if it starts up to 7.5 hours late
  workflow_dispatch:

permissions:
  contents: write   # needed to commit the record back to the repository

concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e .

      # The price database is not stored in git. It is kept between runs as a cache.
      # If the cache is ever lost, the next step simply downloads everything again.
      - name: Restore the price database
        uses: actions/cache/restore@v5
        with:
          path: data/prices.db
          key: prices-db-${{ github.run_id }}
          restore-keys: prices-db-

      - name: Download new prices
        run: python -m elpris backfill --days 730
        continue-on-error: true   # a gap on some old day must not stop today's forecast

      - name: Score earlier forecasts
        run: python -m elpris score

      - name: Forecast tomorrow
        run: python -m elpris forecast

      - name: Save the price database
        if: always()
        uses: actions/cache/save@v5
        with:
          path: data/prices.db
          key: prices-db-${{ github.run_id }}

      - name: Commit the record
        run: |
          git config user.name "elpris-bot"
          git config user.email "elpris-bot@users.noreply.github.com"
          git add record
          if git diff --cached --quiet; then
            echo "Nothing new to record."
          else
            git commit -m "Daily record $(date -u +%F)"
            git push
          fi
